name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore "SEN-T WEB.sln"

    - name: Build
      run: dotnet build "SEN-T WEB.sln" --configuration Release --no-restore

    - name: Test
      run: |
        dotnet test "SEN-T WEB.sln" --no-build --verbosity normal
